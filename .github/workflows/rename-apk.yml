name: Rename APK to QuickBudget-Native.apk
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace APK file
        run: |
          ls -l MoneyNorth.apk QuickBudget-Native.apk
          git rm -q QuickBudget-Native.apk
          git mv MoneyNorth.apk QuickBudget-Native.apk
          git status --short
          ls -l QuickBudget-Native.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace QuickBudget-Native.apk with MoneyNorth v1.7.24"
          git push
